{% extends 'base.html' %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}
<a href="{{ request.GET.next|default:'/products/' }}" class="btn btn-secondary">
    ← Назад
</a>


<h1 class="page-title">{{ category.name }}</h1>

<div class="products-grid">
    {% for product in products %}
        <div class="product-card">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">{{ product.price }} ₽</p>

            <a href="{% url 'product_detail_page' product.id %}" class="btn btn-outline">
                Подробнее
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
