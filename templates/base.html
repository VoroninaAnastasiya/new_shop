{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="header">
    <div class="logo">MyShop</div>
    <nav class="nav">
        <a href="{% url 'products_page' %}">Товары</a>
        {% if request.user.is_authenticated %}
            <a href="{% url 'profile_page' %}">Профиль</a>
            <a href="{% url 'cart_page' %}">Корзина</a>
            <a href="{% url 'logout_page' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login_page' %}">Войти</a>
            <a href="{% url 'register_page' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

</body>
</html>
